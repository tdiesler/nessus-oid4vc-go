Vault:
  Addr: http://192.168.0.30:30820
  OidcProvider: oid4vc
  OidcClient: oid4vc-client
  RedirectURI: http://localhost:8400/callback

Oid4vci:
  Addr: http://127.0.0.1:9000

CredentialConfigurations:
  - Id: natural_person_sd
    Format: dc+sd-jwt
    Vct: NaturalPerson
    Claims: [id, email, firstName, familyName]
  - Id: natural_person_jwt
    Format: jwt_vc_json
    Vct: NaturalPerson
    Claims: [id, email, firstName, familyName]

Scopes:
  - Name: natural_person
    CredentialConfigurationIds: [natural_person_sd, natural_person_jwt]
