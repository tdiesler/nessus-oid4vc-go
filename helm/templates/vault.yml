{{- with .Values.deployments.vault }}
---

# Vault StatefulSet (dev mode — in-memory storage, not for production)
#
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/release: {{ $.Release.Name }}
    spec:
      containers:
        - name: vault
          image: {{ .image }}:{{ .version }}
          imagePullPolicy: {{ .pullPolicy }}
          command: [ "vault", "server", "-dev", "-dev-listen-address=0.0.0.0:8200" ]
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom: { secretKeyRef: { name: vault-secret, key: ROOT_TOKEN } }
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          ports:
            - containerPort: 8200
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
---

# Vault Service
#
apiVersion: v1
kind: Service
metadata:
  name: vault
spec:
  type: NodePort
  ports:
    - port: 8200
      nodePort: {{ .nodePort }}
  selector:
    app.kubernetes.io/name: vault
---
{{- end }}
